name: TTD public monitor

on:
  schedule:
    # Every 5 minutes (at :02, :07, ...), offset from the busy top of the hour. Runs can still start late.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Only send a test notification to the phone"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ttd-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poc/requirements.txt

      - name: Install Playwright and Chromium
        run: |
          pip install -r poc/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore last seen state
        uses: actions/cache/restore@v4
        with:
          path: monitor/state
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Send test notification
        if: inputs.test_alert
        env:
          TTD_NTFY_TOPIC: ${{ secrets.TTD_NTFY_TOPIC }}
        run: python monitor/public_monitor.py --test-alert

      - name: Check TTD public pages
        if: ${{ !inputs.test_alert }}
        # A failed check is reported to the phone by the monitor itself, so don't fail the job.
        continue-on-error: true
        env:
          TTD_NTFY_TOPIC: ${{ secrets.TTD_NTFY_TOPIC }}
        run: python monitor/public_monitor.py --once

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: monitor/state
          key: monitor-state-${{ github.run_id }}
